[module/spotify]
click-left  = spotify
;click-left = wmctrl -xa spotify.Spotify
type = custom/script
tail = true
interval = 1
; prefix symbol is shown before the text
format-prefix = "%{T7}%{T-} "
format = <label>
exec = ~/.config/polybar/scripts/polybar-spotify/scroll_spotify_status.sh

[module/spotify-prev]
type = custom/script
exec = echo " "
format = <label>
click-left = playerctl previous -p spotify


[module/spotify-play-pause]
type = custom/ipc
hook-0 = echo ""
hook-1 = echo ""
format = <label>
initial = 1
click-left = playerctl play-pause -p spotify

[module/spotify-next]
type = custom/script
exec = echo " "
format = <label>
click-left = playerctl next -p spotify


