;label-disconnected = ""

[module/wired-network]
type = custom/script
exec = ~/.config/polybar/scripts/check_internet.sh
interval = 2

[module/my-network]
type = custom/script
exec = ~/.config/polybar/scripts/check_connection_type.sh
interval = 2


[module/network]
type = internal/network
interface = enp0s3
click-left = nm-connection-editor &

interval = 1.0
accumulate-stats = true
unknown-as-up = true

format-connected = <label-connected>
format-connected-foreground = ${color.white}
format-disconnected = <label-disconnected>
format-disconnected-foreground = ${color.gray}

label-connected = %{A3:nm-connection-editor &:}直%{A}
label-disconnected = %{A3:nm-connection-editor &:}睊%{A}


[module/ethernet_status]
type = custom/script
interval = 2
exec = ~/.config/bin/ethernet_status.sh

