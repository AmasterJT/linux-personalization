[terminal.shell]
program = "/bin/sh"
args = ["-c", 'exec /bin/sh "${XDG_CONFIG_HOME:-$HOME/.config}/alacritty/tmux-session.sh"']

[window]
opacity = 0.95
# Evita desajustes de la rejilla que dejan copias de la barra de tmux.
resize_increments = false
padding = {x=5, y=5}
#startup_mode = "Fullscreen"

[cursor]
style = "Beam"


[colors.normal]
black = "#21222c"
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"
white = "#f8f8f2"


[colors.primary]
background = "#0C0f16"
foreground = "#f8f8f2"


[colors.cursor]
text = "CellBackground"
cursor = "CellForeground"


[font]
size = 10.0
normal = { family = "Hack Nerd Font Mono", style = "Regular" }


[selection]
save_to_clipboard = true


[keyboard]
bindings = [
  { key = "T",   mods = "Control|Shift", chars = "\u0001c"  },
  { key = ")",   mods = "Control|Shift", chars = "\u0001%"  },
  { key = "=", mods = "Control|Shift", chars = "\u0001\"" },
  { key = "Tab", mods = "Control",       chars = "\u0001n"  },
  { key = "Tab", mods = "Control|Shift", chars = "\u0001p"  },
  { key = "F11", action = "ToggleFullscreen" }
]
