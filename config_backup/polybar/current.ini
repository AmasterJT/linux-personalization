[module/sysmenu]
type = custom/text
content = "襤"
content-foreground = ${color.white}
click-left = ~/.config/polybar/scripts/powermenu_alt

[module/settings]
type = custom/text
content = ""
content-foreground = ${color.white}
click-left = gnome-control-center & disown

